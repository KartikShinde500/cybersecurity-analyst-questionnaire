        padding: 0 15px;
      }

      /* ================================
           TITLE
        ================================= */

        font-weight: 700;
        font-size: 32px;
      }

      /* ================================
           PART HEADER
        ================================= */

      .part-header {
        font-size: 17px;
      }

      /* ================================
           QUESTION
        ================================= */

      .question-button {
        /* Allow long questions to wrap */

        /* Prevent text overflow */

        /* Prevent long text/code from breaking page */

      }

      .question-answer ul,
      .question-answer ol {
        padding-left: 25px;
      }

      /* ================================
           TABLE RESPONSIVENESS

          font-size: 15px;
          padding: 14px 45px 14px 12px;

      /* ================================

        ================================= */

      @media (max-width: 375px) {
        .page-title {
          font-size: 21px;

        .part-header {

    </style>

  <body>
    <div class="container main-container px-5" style="margin-bottom: 600px">
      <!-- Page Header -->
      <div class="text-center mb-4">
        <h2 class="page-title">Cybersecurity Interview Preparation</h2>

        <p class="text-muted">Security Analyst | MDE | XDR | Purview DLP</p>
      </div>

      <!-- Accordion -->
      <div class="accordion" id="partsAccordion"></div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>

    <script>
      const interviewParts = [
        /* PART 1 */
        {
          id: "part1",
          title: "Part 1 – Basic Introduction & Security Fundamentals",
          description: "Basic cybersecurity and security fundamentals",

          questions: [
            {
              question: "Tell me about yourself.",
              status: "done",
              answer: `
                    <ul>
                        <li>My name is Kartik Shinde and I am from Pune.</li>
                        <li>I completed my MCA in 2025.</li>
                        <li>I have around one year of professional experience in Cyber Security.</li>
                        <li>I worked with Microsoft Defender XDR, Microsoft Defender for Endpoint and Microsoft Purview.</li>
                        <li>My responsibilities included security monitoring, alert investigation, endpoint analysis and incident reporting.</li>
                        <li>I am interested in Security Operations, Incident Response and Threat Detection.</li>
                    </ul>
                `,
            },

            {
              question:
                "What are the roles and responsibilities of a Security Analyst?",

              status: "done",

              answer: `
                    <ul>
                        <li>Monitor security alerts and incidents.</li>
                        <li>Perform alert triage based on severity.</li>
                        <li>Investigate suspicious activities.</li>
                        <li>Use Device Timeline and Process Tree for investigation.</li>
                        <li>Analyze file information and network activity.</li>
                        <li>Monitor MDE agent/device health.</li>
                        <li>Agent installation and onboarding.</li>
                        <li>Troubleshoot agent installation and onboarding issues.</li>
                        <li>Fine-tune security policies.</li>
                        <li>Escalate critical incidents.</li>
                        <li>Prepare daily/weekly security reports.</li>
                        <li>Coordinate with IT teams for remediation.</li>
                    </ul>
                `,
            },

            {
              question: "What is a Security Incident?",
              status: "done",

              answer: `
                    <ol>
                        <li>A security incident is a security event that has actual or potential security impact.</li>
                        <li>It can affect:
                            <ul>
                                <li>Confidentiality</li>
                                <li>Integrity</li>
                                <li>Availability</li>
                            </ul>
                        </li>
                        <li>Examples:
                            <ul>
                                <li>Malware infection</li>
                                <li>Ransomware</li>
                                <li>Phishing</li>
                                <li>Unauthorized access</li>
                                <li>Data leakage</li>
                            </ul>
                        </li>
                    </ol>
                `,
            },

            {
              question: "What is the CIA Triad?",
              status: "done",

              answer: `
                    <ul>
                        <li>Confidentiality: Ensures that information is accessible only to authorized users.</li>
                        <li>Integrity: Ensures that data is accurate and has not been modified without authorization.</li>
                        <li>Availability: Ensures that systems and data are available when required.</li>
                    </ul>
                `,
            },

            {
              question:
                "What is the difference between Threat, Vulnerability and Risk?",
              status: "done",

              answer: `
                    <ul>
                        <li>Threat: Anything that can potentially cause harm to a system or organization.</li>
                        <li>Vulnerability: A weakness that can be exploited by a threat.</li>
                        <li>Risk: The potential impact or loss when a threat exploits a vulnerability.</li>
                    </ul>
                `,
            },

            {
              question: "Phishing Attack?",
              answer: `Phishing is a social engineering attack used to fake messages or websites to trick victims into giving away sensitive information.`,
            },

            {
              question:
                "What is the difference between Virus, Trojan, Worm and Ransomware?",

              answer: `
                    <ul>
                        <li>Virus: Malicious code that attaches itself to a file or program and usually requires user execution to spread.</li>
                        <li>Trojan: Malicious software that pretends to be legitimate software to trick the user.</li>
                        <li>Worm: Malware that can self-replicate and spread across systems or networks.</li>
                        <li>Ransomware: Malware that encrypts or locks data/systems and demands payment from the victim.</li>
                    </ul>
                `,
            },
          ],
        },

        /* PART 2 */

        {
          id: "part2",
          title: "Part 2 – Computer Network Fundamentals",
          description:
            "Networking concepts required for Security Analyst interviews",

          questions: [
            {
              question: "What is Networking?",

              answer: `
                    <ul>
                        <li>Networking is the process of connecting computers, devices and systems so they can communicate and share data.</li>
                        <li>It uses protocols such as TCP/IP, DNS, HTTP and HTTPS.</li>
                        <li>Networking is important in cybersecurity because security analysts monitor network traffic and communication.</li>
                    </ul>
                `,
            },

            {
              question: "What is a Firewall?",

              answer: `
                    <ul>
                        <li>A firewall is a security control that monitors and controls incoming and outgoing network traffic.</li>
                        <li>It allows or blocks traffic based on predefined rules.</li>
                        <li>It can control traffic based on IP address, port, protocol and other conditions.</li>
                        <li>It helps prevent unauthorized network access.</li>
                    </ul>
                `,
            },

            {
              question: "Explain the OSI Model.",

              answer: `
                    <ul>
                      <li>The OSI (Open Systems Interconnection) model used to understand how data is communicated between network devices.</li>
                      <li>It has 7 layers:</li>
                    </ul>
                    <ol>
                        <li>Physical – Cables, signals and physical transmission.</li>
                        <li>Data Link – Handles MAC addressing and frames.</li>
                        <li>Network – IP addressing and routing.</li>
                        <li>Transport – TCP and UDP. ensures realability, and fast data delivery.</li>
                        <li>Session – Establishes and manages sessions.</li>
                        <li>Presentation – Data formatting, encryption and compression.</li>
                        <li>Application – Network services used by applications such as HTTP, DNS and FTP.</li>
                    </ol>
                `,
            },

            {
              question: "What is TCP?",

              answer: `
                    <ul>
                        <li>TCP stands for Transmission Control Protocol.</li>
                        <li>It is a connection-oriented protocol.</li>
                        <li>It provides reliable and ordered delivery of data.</li>
                        <li>It uses three-way handshake to eastablished transmission and retransmission.</li>
                        <li>Examples include HTTP/HTTPS, SSH and FTP.</li>
                    </ul>
                `,
            },

            {
              question: "What is TCP 3-Way Handshake?",

              answer: `
                    <ol>
                        <li><strong>SYN:</strong> Client sends a SYN packet to the server.</li>
                        <li><strong>SYN-ACK:</strong> Server responds with SYN-ACK.</li>
                        <li><strong>ACK:</strong> Client sends ACK.</li>
                    </ol>

                    <div class="alert alert-success">
                        <strong>Easy:</strong> SYN → SYN-ACK → ACK
                    </div>
                `,
            },

            {
              question: "What is UDP?",

              answer: `
                    <ul>
                        <li>UDP stands for <strong>User Datagram Protocol</strong>.</li>
                        <li>It is connectionless.</li>
                        <li>It is faster than TCP because it does not establish a connection before sending data.</li>
                        <li>It does not guarantee delivery, ordering or retransmission.</li>
                        <li>It is commonly used for DNS, streaming and VoIP.</li>
                    </ul>
                `,
            },

            {
              question: "What is Routing?",

              answer: `
                    <ul>
                        <li>Routing is the process of selecting a path for network traffic to travel from source to destination.</li>
                        <li>Routers use routing tables to determine the best path.</li>
                        <li>Routing can be static or dynamic.</li>
                    </ul>
                `,
            },

            {
              question: "What is DNS?",

              answer: `
                    <ul>
                        <li>DNS stands for <strong>Domain Name System</strong>.</li>
                        <li>It converts domain names into IP addresses.</li>
                        <li>For example, a user enters a domain name and DNS helps find the corresponding IP address.</li>
                        <li>DNS commonly uses port <strong>53</strong>.</li>
                    </ul>
                `,
            },

            {
              question: "What is DHCP?",

              answer: `
                    <ul>
                        <li>DHCP stands for <strong>Dynamic Host Configuration Protocol</strong>.</li>
                        <li>It automatically provides network configuration to devices.</li>
                        <li>It can provide IP address, subnet mask, default gateway and DNS server information.</li>
                    </ul>
                `,
            },

            {
              question: "What is an IP Address?",

              answer: `
                    <ul>
                        <li>An IP address is a logical address assigned to a device on a network.</li>
                        <li>It helps identify and communicate with devices.</li>
                        <li>There are two common versions: <strong>IPv4</strong> and <strong>IPv6</strong>.</li>
                        <li>Example IPv4: <strong>192.168.1.10</strong>.</li>
                    </ul>
                `,
            },

            {
              question: "What is an MAC Address?",

              answer: `
                    <ul>
                      <li>A MAC (Media Access Control) address is a unique 12-digit physical hardware code.</li>
                      <li>assigned to a device's network card by the maker.</li>
                      <li>It controls how data packets are sent to the correct local device on a network segment</li>
                    </ul>
                `,
            },

            {
              question: "What is the difference between a Router and a Switch?",

              answer: `
                    <ul>
                        <li><strong>Router:</strong> Connects different networks and forwards traffic using IP addresses.</li>
                        <li><strong>Switch:</strong> Connects devices within a network and primarily uses MAC addresses for forwarding.</li>
                    </ul>
                `,
            },

            {
              question: "What is Wireshark?",

              answer: `
                    <ul>
                        <li>Wireshark is a network protocol analyzer.</li>
                        <li>It captures and analyzes network packets.</li>
                        <li>Security analysts can use it to troubleshoot network issues and investigate suspicious traffic.</li>
                        <li>It supports analysis of protocols such as TCP, UDP, DNS, HTTP and many others.</li>
                    </ul>
                `,
            },
          ],
        },

        /* PART 3 */

        {
          id: "part3",
          title: "Part 3 – MDE concepts & Fine-Tunning & False Positive",
          description: "MDE concepts and security capabilities",

          questions: [
            {
              question: "What is Microsoft Defender for Endpoint?",

              answer: `
                    <ol class="">
                        <li class="mb-2">
                          Microsoft Defender for Endpoint (MDE)
                          is a cloud-based endpoint security solution from
                          Microsoft.
                        </li>

                        <li class="mb-2">
                          It helps organizations protect endpoints such as:
                          <ul class="mt-2">
                            <li>Windows devices</li>
                            <li>Linux devices</li>
                            <li>macOS devices</li>
                            <li>Mobile devices</li>
                            <li>Servers</li>
                          </ul>
                        </li>

                        <li class="mb-2">
                          MDE provides capabilities such as:
                          <ul class="mt-2">
                            <li>Endpoint Detection and Response (EDR)</li>
                            <li>Threat and vulnerability management</li>
                            <li>Attack Surface Reduction (ASR)</li>
                            <li>
                              Automated Investigation and Remediation (AIR)
                            </li>
                            <li>Endpoint protection</li>
                            <li>Device isolation</li>
                            <li>Advanced threat detection</li>
                          </ul>
                        </li>

                        <li class="mb-2">
                          Security analysts can investigate incidents using:
                          <ul class="mt-2">
                            <li>Device Timeline</li>
                            <li>Process Tree</li>
                            <li>Alerts</li>
                            <li>Advanced Hunting</li>
                            <li>File and network activity</li>
                          </ul>
                        </li>
                    </ol>
                `,
            },

            {
              question: "What is EDR and why is it important?",

              answer: `
                    <ul>
                        <li>EDR stands for Endpoint Detection and Response.</li>
                        <li>It continuously monitors endpoint activity.</li>
                        <li>It collects information  such as processes activity, files activity, network activity and user activity.</li>
                        <li>It helps security analysts detect suspicious behavior and investigate incidents.</li>
                        <li>It also provides response capabilities such as device isolation.</li>
                    </ul>
                `,
            },

            {
              question: "What is Device Timeline?",

              answer: `
                    <ol class="mt-3">
                        <li class="mb-2">
                          <strong>Device Timeline</strong> provides a
                          chronological view of activities that occurred on an
                          endpoint.
                        </li>

                        <li class="mb-2">
                          It helps analysts understand what happened on a device
                          before, during, and after a security alert.
                        </li>

                        <li class="mb-2">
                          It can show activities such as:
                          <ul class="mt-2">
                            <li>Process execution</li>
                            <li>File creation or modification</li>
                            <li>Network connections</li>
                            <li>Logon activity</li>
                            <li>Registry changes</li>
                            <li>Security events</li>
                          </ul>
                        </li>

                        <li>
                          It is useful for establishing the
                          <strong>timeline and root cause of an incident</strong
                          >.
                        </li>
                      </ol>
                `,
            },

            {
              question: "What is Process Tree?",

              answer: `
                    <ul>
                        <li>Process Tree shows the relationship between parent and child processes.</li>
                        <li>It helps analysts understand how a suspicious process was started.</li>
                        <li>It is useful for detecting suspicious execution chains and attack behavior.</li>
                    </ul>
                `,
            },

            {
              question: "What is Device Isolation?",

              answer: `
                    <ul>
                        <li>Device Isolation is an MDE response action used to contain a compromised endpoint.</li>
                        <li>It helps prevent the device from communicating with other systems and potentially spreading the threat.</li>
                        <li>After isolation, the security team can investigate the endpoint and perform remediation.</li>
                    </ul>
                `,
            },

            {
              question: "What is ASR – Attack Surface Reduction?",

              answer: `
                    <ul>
                        <li>ASR stands for <strong>Attack Surface Reduction</strong>.</li>
                        <li>ASR rules help reduce common attack techniques used by malware and attackers.</li>
                        <li>Examples include blocking suspicious Office child processes and risky script behavior.</li>
                        <li>Policies should be tested and fine-tuned before broad enforcement.</li>
                    </ul>
                `,
            },

            {
              question:
                "What is AIR – Automated Investigation and Remediation?",

              answer: `
                    <ul>
                        <li>AIR stands for <strong>Automated Investigation and Remediation</strong>.</li>
                        <li>It automatically investigates certain alerts and identifies potentially malicious activities.</li>
                        <li>It can recommend or perform remediation actions depending on configuration and permissions.</li>
                        <li>It helps reduce manual investigation effort and improve response time.</li>
                    </ul>
                `,
            },

            {
              question: "What is a False Positive?",

              answer: `
                    <ul>
                        <li>A false positive occurs when a security solution identifies legitimate activity as suspicious or malicious.</li>
                        <li>Example: A legitimate business application is detected as potentially malicious.</li>
                        <li>False positives should be investigated and controlled through appropriate policy fine-tuning.</li>
                    </ul>
                `,
            },

            {
              question: "How do you reduce False Positives in MDE?",

              answer: `
                    <ul>
                      <li>First, I investigate the alert using the Process Tree, Device Timeline, file details, and user activity.</li>
                      <li>If the activity is confirmed as legitimate, I validate the business requirement and take the required approval.</li>
                      <li>Then, if necessary, I apply specific and limited policy tuning or an exclusion rather than making a broad change.</li>
                      <li>I test the change to make sure the legitimate activity works as expected.</li>
                      <li>Finally, I continuously monitor the alerts to confirm that false positives are reduced without creating a security gap.</li>
                    </ul>
                `,
            },

            {
              question: "What is Fine-Tuning in MDE?",

              answer: `
                    <ul>
                        <li>Fine-tuning means adjusting security policies or controls based on investigation results.</li>
                        <li>First, I investigate the alert and determine whether the activity is legitimate or malicious.</li>
                        <li>If legitimate, I make the minimum required approved change.</li>
                        <li>I avoid broad exclusions and continuously monitor the result.</li>
                    </ul>
                `,
            },

            {
              question: "What is your approach to MDE policy Fine-Tuning?",

              answer: `
                    <ol>
                        <li>Policy fine-tuning means adjusting the security policy after deployment based on alerts, false positives and business requirements.</li>
                        <li>I first analyze the alerts, identify the root cause, make the minimum required change, test it on a pilot group,</li>
                        <li>and then monitor the results before applying it to production.</li>
                    </ol>
                `,
            },
          ],
        },

        /* PART 4 */

        {
          id: "part4",
          title:
            "Part 4 – MDE Deployment & Challenges & Operations & Troubleshoot",
          description:
            "MDE deployment, onboarding and security policy management",

          questions: [
            {
              question:
                "How would you deploy Microsoft Defender for Endpoint on 25,000 devices?",

              answer: `
                    <ol>
                        <li>First, I will understand environment.</li>
                        <li>Check supported operating systems.</li>
                        <li>Verify network, proxy and firewall connectivity.</li>
                        <li>Identify existing antivirus/security solutions.</li>
                        <li>Select the appropriate onboarding method such as Intune or Configuration Manager.</li>
                        <li>Start with a pilot group, First onboard a small group of around 100 devices. Including devices from IT, Security, and different business departments.</li>
                        <li>Verify sensor health and confirm that alerts are being received properly.</li>
                        <li>If the pilot is successful, I will gradually deploy MDE in batches.For example: 100 → 500 → 2,000 → 5,000 → remaining devices.</li>
                        <li>After each phase, monitor onboarding success rate, device health, alerts, and performance impact.</li>
                        <li>Finally, Onboard remaining devices and prepare deployment and health reports.</li>
                    </ol>

                `,
            },

            {
              question: "What challenges can occur during Defender deployment?",

              answer: `
                    <ul>
                      <li>The common challenges I faced were, inconsistent onboarding methods,
                        where Different onboarding methods can cause duplicate onboarding or configuration issues.</li>
                      <li>Some devices may not appear in the Defender Portal after onboarding.</li>
                      <li>Network connectivity issues.</li>
                      <li>Proxy or firewall configuration problems.</li>
                      <li>Unsupported operating systems or missing prerequisites.</li>
                      <li>Third-party antivirus create conflicts.</li>
                      <li>Onboarding policy or script failures.</li>
                      <li>Too many alerts and false positives.</li>
                      <li>Legitimate applications being blocked.</li>
                      <li>Another common challenge is enabling security policies too aggressively</li>
                    </ul>

                    <p>
                        The common challenges I faced were onboarding issues, devices not appearing in the Defender Portal, network or proxy problems,
                        third-party antivirus conflicts, policy or script failures, false positives, and legitimate applications being blocked.
                        Sometimes aggressive security policies also affected business applications.

                        I would address these through pilot deployment, phased rollout, monitoring and
                        policy fine-tuning.
                    </p>
                `,
            },

            {
              question: "What is your daily MDE operational activities?",

              status: "done",

              answer: `
                    <ul>
                      <li>Operation activities included such as,
                      <li>Check/Monitor onboarded endpoint health and sensor status.</li>
                      <li>Monitor security alerts and incidents.</li>
                      <li>Prioritize alerts based on severity and business impact.</li>
                      <li>Investigate suspicious activities.</li>
                      <li>Use Device Timeline, Process Tree, file and network information.</li>
                      <li>Troubleshoot agent installation and onboarding issues.</li>
                      <li>Monitor or identify false positives alerts and fine-tune policies when required.</li>
                      <li>Prepare reports such as incident report, endpoint health report.</li>
                    </ul>
                `,
            },

            {
              question:
                "Steps for Device/Endpoint Onboarding?",
              status: "done",
              // status:"revision",

              answer: `
                    <ol>
                        <li>First step is Log in to Microsoft Defender Portal</li>
                        <li>Then Go to onboarding.
                        <li>And then Select operaing system.</li>
                        <li>Then select deployment method.</li>
                        <li>Then Click Download onboarding package/script.</li>
                        <li>A Zip file will be downloaded.</li>
                        <li>Extract the downloaded Zip file.</li>
                        <li>Run script file as administrator.</li>
                        <li>The device will start onboarding to MDE.</li>
                        <li>And verify the device appears in the Defender Portal.</li>
                    </ol>
                `,
            },

            {
              question:
                "What issues you faced while working with Microsoft Defender for Endpoint and how did you handle them?",

              status: "done",

              answer: `
                    <ul>
                        <li class=""><strong>MDE Agent/Onboarding Issues:</strong> Sometimes a device was not appearing in the Defender Portal or onboarding was not completed successfully.</li>
                        I checked the onboarding method, network connectivity, MDE sensor/service status, and onboarding logs, then verified the device in the Defender Portal.

                        <li class="mt-2"><strong>Device Unhealthy:</strong> Some devices showed an unhealthy sensor or stopped communicating with the Defender Portal.</li>

                        <li class="mt-2"><strong>False Positives:</strong> Legitimate applications or activities were sometimes detected as suspicious.</li>
