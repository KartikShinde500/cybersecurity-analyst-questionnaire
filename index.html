  <head>
    <meta charset="UTF-8" />

    <!-- Important for mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cybersecurity Interview Preparation</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
      /* ================================
           GENERAL
        ================================= */

      body {
        margin: 0;
        padding: 0;
      }

      .main-container {
        width: 100%;
        max-width: 1100px;
        margin: 30px auto;
        padding: 0 15px;
      }

      /* ================================
           TITLE
        ================================= */

      .page-title {
        font-weight: 700;
        font-size: 32px;
      }

      /* ================================
           PART HEADER
        ================================= */

      .part-header {
        font-weight: 600;
        font-size: 18px;
      }

      /* ================================
           QUESTION
        ================================= */

      .question-button {
        font-weight: 500;

        /* Allow long questions to wrap */
        white-space: normal;

        /* Prevent text overflow */
        overflow-wrap: anywhere;

        text-align: left;

        line-height: 1.5;
      }

      /* ================================
           ANSWER
        ================================= */

      .question-answer {
        background-color: #f8f9fa;
        line-height: 1.6;

        /* Prevent long text/code from breaking page */
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .question-answer ul,
      .question-answer ol {
        padding-left: 25px;
      }

      /* ================================
           TABLE RESPONSIVENESS
        ================================= */

      .question-answer table {
        width: 100%;
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }

      /* ================================
           CODE RESPONSIVENESS
        ================================= */

      pre {
        max-width: 100%;
        overflow-x: auto;
      }

      /* ================================
           BOOTSTRAP ACCORDION
        ================================= */

      .accordion-button {
        word-break: break-word;
      }

      .accordion-button:focus {
        box-shadow: none;
      }
      .question-count {
        font-size: 12px;
        font-weight: 500;
        flex-shrink: 0;
      }

      /* ================================
           MOBILE
        ================================= */

      @media (max-width: 576px) {
        .main-container {
          margin: 10px auto;
          padding: 0 10px;
        }

        .page-title {
          font-size: 24px;
          line-height: 1.3;
        }

        .page-title + p {
          font-size: 13px;
        }

        /* Part title */
        .part-header {
          font-size: 15px;
          padding: 14px 45px 14px 12px;
        }

        /* Questions */
        .question-button {
          font-size: 14px;
          padding: 12px 40px 12px 12px;
        }

        .question-count {
          font-size: 10px;
          margin-left: 8px !important;
          white-space: nowrap;
        }

        /* Answers */
        .question-answer {
          font-size: 14px;
          padding: 14px 12px;
        }

        .question-answer ul,
        .question-answer ol {
          padding-left: 22px;
        }

        /* Bootstrap accordion spacing */
        .accordion-item {
          border-radius: 6px !important;
        }
      }

      /* ================================
           VERY SMALL PHONES
        ================================= */

      @media (max-width: 375px) {
        .page-title {
          font-size: 21px;
        }

        .part-header {
          font-size: 14px;
        }

        .question-button {
          font-size: 13px;
        }

        .question-answer {
          font-size: 13px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container main-container">
      <!-- Page Header -->
      <div class="text-center mb-4">
        <h2 class="page-title">Cybersecurity Interview Preparation</h2>

        <p class="text-muted">Security Analyst | MDE | XDR | Purview DLP</p>
      </div>

      <!-- Accordion -->
      <div class="accordion" id="partsAccordion"></div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>

    <script>
      const interviewParts = [
        /* PART 1 */
        {
          id: "part1",
          title: "Part 1 – Basic Introduction & Security Fundamentals",
          description: "Basic cybersecurity and security fundamentals",

          questions: [
            {
              question: "Tell me about yourself.",

              answer: `
                    <ul>
                        <li>My name is Kartik Shinde and I am from Pune.</li>
                        <li>I completed my MCA in 2025.</li>
                        <li>I have around one year of professional experience in Cyber Security.</li>
                        <li>I worked with Microsoft Defender XDR, Microsoft Defender for Endpoint and Microsoft Purview.</li>
                        <li>My responsibilities included security monitoring, alert investigation, endpoint analysis and incident reporting.</li>
                        <li>I am interested in Security Operations, Incident Response and Threat Detection.</li>
                    </ul>
                `,
            },

            {
              question:
                "What are the roles and responsibilities of a Security Analyst?",

              answer: `
                    <ul>
                        <li>Monitor security alerts and incidents.</li>
                        <li>Perform alert triage based on severity.</li>
                        <li>Investigate suspicious activities.</li>
                        <li>Use Device Timeline and Process Tree for investigation.</li>
                        <li>Analyze file information and network activity.</li>
                        <li>Monitor MDE agent/device health.</li>
                        <li>Troubleshoot agent installation and onboarding issues.</li>
                        <li>Perform approved whitelisting/exclusions when required.</li>
                        <li>Fine-tune security policies.</li>
                        <li>Escalate critical incidents.</li>
                        <li>Prepare daily/weekly security reports.</li>
                        <li>Coordinate with IT teams for remediation.</li>
                    </ul>
                `,
            },

            {
              question: "What is a Security Incident?",

              answer: `
                    <ol>
                        <li>A security incident is a <strong>security event that has actual or potential security impact</strong>.</li>
                        <li>It can affect:
                            <ul>
                                <li>Confidentiality</li>
                                <li>Integrity</li>
                                <li>Availability</li>
                            </ul>
                        </li>
                        <li>Examples:
                            <ul>
                                <li>Malware infection</li>
                                <li>Ransomware</li>
                                <li>Phishing</li>
                                <li>Unauthorized access</li>
                                <li>Data leakage</li>
                            </ul>
                        </li>
                    </ol>
                `,
            },

            {
              question: "What is the CIA Triad?",

              answer: `
                    <ul>
                        <li><strong>Confidentiality:</strong> Ensures that information is accessible only to authorized users.</li>
                        <li><strong>Integrity:</strong> Ensures that data is accurate and has not been modified without authorization.</li>
                        <li><strong>Availability:</strong> Ensures that systems and data are available when required.</li>
                    </ul>

                    <div class="alert alert-success mt-3">
                        <strong>Easy way to remember:</strong>
                        Confidentiality = Who can access →
                        Integrity = Data is correct →
                        Availability = Data is available
                    </div>
                `,
            },

            {
              question:
                "What is the difference between Threat, Vulnerability and Risk?",

              answer: `
                    <ul>
                        <li><strong>Threat:</strong> Anything that can potentially cause harm to a system or organization.</li>
                        <li><strong>Vulnerability:</strong> A weakness that can be exploited by a threat.</li>
                        <li><strong>Risk:</strong> The potential impact or loss when a threat exploits a vulnerability.</li>
                    </ul>

                    <div class="alert alert-info mt-3">
                        <strong>Example:</strong><br>
                        Vulnerability = Unpatched software<br>
                        Threat = Attacker<br>
                        Risk = System compromise or data loss
                    </div>
                `,
            },

            {
              question:
                "What is the difference between Virus, Trojan, Worm and Ransomware?",

              answer: `
                    <ul>
                        <li><strong>Virus:</strong> Malicious code that attaches itself to a file or program and usually requires user execution to spread.</li>
                        <li><strong>Trojan:</strong> Malicious software that pretends to be legitimate software to trick the user.</li>
                        <li><strong>Worm:</strong> Malware that can self-replicate and spread across systems or networks.</li>
                        <li><strong>Ransomware:</strong> Malware that encrypts or locks data/systems and demands payment from the victim.</li>
                    </ul>
                `,
            },
          ],
        },

        /* PART 2 */

        {
          id: "part2",
          title: "Part 2 – Computer Network Fundamentals",
          description:
            "Networking concepts required for Security Analyst interviews",

          questions: [
            {
              question: "What is Networking?",

              answer: `
                    <ul>
                        <li>Networking is the process of connecting computers, devices and systems so they can communicate and share data.</li>
                        <li>It uses protocols such as TCP/IP, DNS, HTTP and HTTPS.</li>
                        <li>Networking is important in cybersecurity because security analysts monitor network traffic and communication.</li>
                    </ul>
                `,
            },

            {
              question: "What is a Firewall?",

              answer: `
                    <ul>
                        <li>A firewall is a security control that monitors and controls network traffic.</li>
                        <li>It allows or blocks traffic based on predefined rules.</li>
                        <li>It can control traffic based on IP address, port, protocol and other conditions.</li>
                        <li>It helps prevent unauthorized network access.</li>
                    </ul>
                `,
            },

            {
              question: "Explain the OSI Model.",

              answer: `
                    <p>The OSI model has <strong>7 layers</strong>:</p>

                    <ol>
                        <li><strong>Physical</strong> – Cables, signals and physical transmission.</li>
                        <li><strong>Data Link</strong> – MAC address and frames.</li>
                        <li><strong>Network</strong> – IP addressing and routing.</li>
                        <li><strong>Transport</strong> – TCP and UDP.</li>
                        <li><strong>Session</strong> – Establishes and manages sessions.</li>
                        <li><strong>Presentation</strong> – Data formatting, encryption and compression.</li>
                        <li><strong>Application</strong> – Network services used by applications such as HTTP, DNS and FTP.</li>
                    </ol>
                `,
            },

            {
              question: "What is TCP?",

              answer: `
                    <ul>
                        <li>TCP stands for <strong>Transmission Control Protocol</strong>.</li>
                        <li>It is a connection-oriented protocol.</li>
                        <li>It provides reliable and ordered delivery of data.</li>
                        <li>It uses acknowledgements, sequencing and retransmission.</li>
                        <li>Examples include HTTP/HTTPS, SSH and FTP.</li>
                    </ul>
                `,
            },

            {
              question: "What is TCP 3-Way Handshake?",

              answer: `
                    <ol>
                        <li><strong>SYN:</strong> Client sends a SYN packet to the server.</li>
                        <li><strong>SYN-ACK:</strong> Server responds with SYN-ACK.</li>
                        <li><strong>ACK:</strong> Client sends ACK.</li>
                    </ol>

                    <div class="alert alert-success">
                        <strong>Easy:</strong> SYN → SYN-ACK → ACK
                    </div>
                `,
            },

            {
              question: "What is UDP?",

              answer: `
                    <ul>
                        <li>UDP stands for <strong>User Datagram Protocol</strong>.</li>
                        <li>It is connectionless.</li>
                        <li>It is faster than TCP because it does not establish a connection before sending data.</li>
                        <li>It does not guarantee delivery, ordering or retransmission.</li>
                        <li>It is commonly used for DNS, streaming and VoIP.</li>
                    </ul>
                `,
            },

            {
              question: "What is Routing?",

              answer: `
                    <ul>
                        <li>Routing is the process of selecting a path for network traffic to travel from source to destination.</li>
                        <li>Routers use routing tables to determine the best path.</li>
                        <li>Routing can be static or dynamic.</li>
                    </ul>
                `,
            },

            {
              question: "What is DNS?",

              answer: `
                    <ul>
                        <li>DNS stands for <strong>Domain Name System</strong>.</li>
                        <li>It converts domain names into IP addresses.</li>
                        <li>For example, a user enters a domain name and DNS helps find the corresponding IP address.</li>
                        <li>DNS commonly uses port <strong>53</strong>.</li>
                    </ul>
                `,
            },

            {
              question: "What is DHCP?",

              answer: `
                    <ul>
                        <li>DHCP stands for <strong>Dynamic Host Configuration Protocol</strong>.</li>
                        <li>It automatically provides network configuration to devices.</li>
                        <li>It can provide IP address, subnet mask, default gateway and DNS server information.</li>
                    </ul>
                `,
            },

            {
              question: "What is an IP Address?",

              answer: `
                    <ul>
                        <li>An IP address is a logical address assigned to a device on a network.</li>
                        <li>It helps identify and communicate with devices.</li>
                        <li>There are two common versions: <strong>IPv4</strong> and <strong>IPv6</strong>.</li>
                        <li>Example IPv4: <strong>192.168.1.10</strong>.</li>
                    </ul>
                `,
            },

            {
              question: "What is the difference between a Router and a Switch?",

              answer: `
                    <ul>
                        <li><strong>Router:</strong> Connects different networks and forwards traffic using IP addresses.</li>
                        <li><strong>Switch:</strong> Connects devices within a network and primarily uses MAC addresses for forwarding.</li>
                    </ul>
                `,
            },

            {
              question: "What is Wireshark?",

              answer: `
                    <ul>
                        <li>Wireshark is a network protocol analyzer.</li>
                        <li>It captures and analyzes network packets.</li>
                        <li>Security analysts can use it to troubleshoot network issues and investigate suspicious traffic.</li>
                        <li>It supports analysis of protocols such as TCP, UDP, DNS, HTTP and many others.</li>
                    </ul>
                `,
            },
          ],
        },

        /* PART 3 */

        {
          id: "part3",
          title: "Part 3 – Microsoft Defender for Endpoint (MDE)",
          description: "MDE concepts and security capabilities",

          questions: [
            {
              question: "What is Microsoft Defender for Endpoint?",

              answer: `
                    <ul>
                        <li>Microsoft Defender for Endpoint is an endpoint security solution from Microsoft.</li>
                        <li>It protects endpoints such as Windows, macOS, Linux and supported mobile platforms.</li>
                        <li>It provides <strong>EDR</strong>, threat detection, investigation and response capabilities.</li>
                        <li>It helps security teams detect, investigate and respond to endpoint threats.</li>
                    </ul>
                `,
            },

            {
              question: "What is EDR and why is it important?",

              answer: `
                    <ul>
                        <li>EDR stands for <strong>Endpoint Detection and Response</strong>.</li>
                        <li>It continuously monitors endpoint activity.</li>
                        <li>It collects telemetry such as processes, files, network activity and user activity.</li>
                        <li>It helps security analysts detect suspicious behavior and investigate incidents.</li>
                        <li>It also provides response capabilities such as device isolation.</li>
                    </ul>
                `,
            },

            {
              question: "What is Device Timeline?",

              answer: `
                    <ul>
                        <li>Device Timeline provides a chronological view of activities occurring on an endpoint.</li>
                        <li>It can show processes, files, network connections and other activities.</li>
                        <li>Security analysts use it to understand what happened before, during and after an alert.</li>
                    </ul>
                `,
            },

            {
              question: "What is Process Tree?",

              answer: `
                    <ul>
                        <li>Process Tree shows the relationship between parent and child processes.</li>
                        <li>It helps analysts understand how a suspicious process was started.</li>
                        <li>It is useful for detecting suspicious execution chains and attack behavior.</li>
                    </ul>
                `,
            },

            {
              question: "What is Device Isolation?",

              answer: `
                    <ul>
                        <li>Device Isolation is an MDE response action used to contain a compromised endpoint.</li>
                        <li>It restricts the device's network communication to help prevent further spread or attacker communication.</li>
                        <li>The device can still communicate with required Defender services so investigation and remediation can continue.</li>
                    </ul>
                `,
            },

            {
              question: "What is ASR – Attack Surface Reduction?",

              answer: `
                    <ul>
                        <li>ASR stands for <strong>Attack Surface Reduction</strong>.</li>
                        <li>ASR rules help reduce common attack techniques used by malware and attackers.</li>
                        <li>Examples include blocking suspicious Office child processes and risky script behavior.</li>
                        <li>Policies should be tested and fine-tuned before broad enforcement.</li>
                    </ul>
                `,
            },

            {
              question:
                "What is AIR – Automated Investigation and Remediation?",

              answer: `
                    <ul>
                        <li>AIR stands for <strong>Automated Investigation and Remediation</strong>.</li>
                        <li>It automatically investigates certain alerts and identifies potentially malicious activities.</li>
                        <li>It can recommend or perform remediation actions depending on configuration and permissions.</li>
                        <li>It helps reduce manual investigation effort and improve response time.</li>
                    </ul>
                `,
            },

            {
              question: "What is a False Positive?",

              answer: `
                    <ul>
                        <li>A false positive occurs when a security solution identifies legitimate activity as suspicious or malicious.</li>
                        <li>Example: A legitimate business application is detected as potentially malicious.</li>
                        <li>False positives should be investigated and controlled through appropriate policy fine-tuning.</li>
                    </ul>
                `,
            },

            {
              question: "What is Fine-Tuning in MDE?",

              answer: `
                    <ul>
                        <li>Fine-tuning means adjusting security policies or controls based on investigation results.</li>
                        <li>First, I investigate the alert and determine whether the activity is legitimate or malicious.</li>
                        <li>If legitimate, I make the minimum required approved change.</li>
                        <li>I avoid broad exclusions and continuously monitor the result.</li>
                    </ul>
                `,
            },
          ],
        },

        /* PART 4 */

        {
          id: "part4",
          title:
            "Part 4 – MDE Agent & Endpoint Operations and Report generation and Issue faced",
          description:
            "Practical MDE agent and endpoint operational experience",

          questions: [
            {
              question: "What is your daily MDE operational activities?",

              answer: `
                    <ul>
                        <li>Check the health of onboarded devices.</li>
                        <li>Review new security alerts and incidents.</li>
                        <li>Prioritize alerts based on severity and business impact.</li>
                        <li>Investigate suspicious activities.</li>
                        <li>Review Device Timeline, Process Tree, file and network information.</li>
                        <li>Monitor endpoint health and sensor status.</li>
                        <li>MDE onboarding troubleshooting.</li>
                        <li>Review security recommendations and vulnerabilities.</li>
                        <li>Monitor false positives and fine-tune policies when required.</li>
                        <li>Prepare reports and escalate critical incidents.</li>
                    </ul>
                `,
            },

            {
              question:
                "What issues have you faced while working with Microsoft Defender for Endpoint and how did you handle them?",

              answer: `
                    <ul>
                        <li class=""><strong>MDE Agent/Onboarding Issues:</strong> Sometimes a device was not appearing in the Defender Portal or onboarding was not completed successfully.</li>
                        I checked the onboarding method, network connectivity, MDE sensor/service status, and onboarding logs, then verified the device in the Defender Portal.

                        <li class="mt-2"><strong>Device Unhealthy:</strong> Some devices showed an unhealthy sensor or stopped communicating with the Defender Portal.</li>
                        I checked Last Seen, Sensor Health, network connectivity and the MDE sensor service, then coordinated with the IT team if required.

                        <li class="mt-2"><strong>False Positives:</strong> Legitimate applications or activities were sometimes detected as suspicious.</li>
                        I investigated the alert using Device Timeline, Process Tree, file information and user/business context. If it was confirmed legitimate, I followed the approval process and applied a specific exclusion or policy adjustment.

                        <li class="mt-2"><strong>Application Blocking:</strong> A legitimate business application could be blocked by a security policy.</li>
                        I verified the application, checked the detection details, confirmed the business requirement, and performed controlled policy fine-tuning after approval.

                        <li class="mt-2"><strong>High Alert Volume:</strong> Some policies could generate a large number of alerts.</li>
                        I reviewed recurring alerts, identified false positives, fine-tuned the policies and avoided unnecessary broad exclusions.
                    </ul>
                
                    <div class="alert alert-success mt-3">
                        <strong>Interview Summary:</strong>
                        The main issues I faced were onboarding/agent health issues, false positives,
                        application blocking and high alert volume. I handled them through
                        troubleshooting, investigation, controlled policy fine-tuning and coordination
                        with the IT team.
                    </div>
                `,
            },

            {
              question:
                "How do you generate reports in Microsoft Defender for Endpoint?",

              answer: `
                    <ul>
                        <li>Open the Microsoft Defender Portal.</li>
                        <li>Review security incidents, alerts, device health and exposure information.</li>
                        <li>Use available reports and dashboards based on the reporting requirement.</li>
                        <li>Export relevant information when required.</li>
                        <li>Prepare reports containing items such as incident count, severity, device health, remediation status and trends.</li>
                    </ul>
                `,
            },

            {
              question: "Have you worked on MDE Agent Installation/Onboarding?",

              answer: `
                    <ul>
                        <li>Yes, I have worked with MDE endpoint onboarding.</li>
                        <li>For a single Windows device, I can use the Local Script onboarding method.</li>
                        <li>For managed enterprise devices, onboarding can be performed using Microsoft Intune.</li>
                        <li>After onboarding, I verify the device in the Defender Portal.</li>
                        <li>I check device health, sensor status, last seen and telemetry.</li>
                    </ul>
                `,
            },

            {
              question:
                "How do you troubleshoot MDE Agent Installation or Onboarding issues?",

              answer: `
                    <ul>
                        <li>Check whether the device meets the onboarding prerequisites.</li>
                        <li>Check network and Internet connectivity.</li>
                        <li>Check proxy and firewall configuration.</li>
                        <li>Verify the MDE sensor/service status.</li>
                        <li>Verify that the onboarding policy or script was applied correctly.</li>
                        <li>Review available logs and error information.</li>
                        <li>Fix the issue and verify communication with the Defender Portal.</li>
                    </ul>
                `,
            },

            {
              question: "What is Whitelisting in MDE?",

              answer: `
                    <ul>
                        <li>Whitelisting means allowing a known and trusted application, file or activity that would otherwise be blocked or detected.</li>
                        <li>In MDE, this should be handled through appropriate exclusions or policy configuration.</li>
                        <li>Whitelisting should be specific, justified, approved and regularly reviewed.</li>
                    </ul>
                `,
            },

            {
              question: "How do you handle a Whitelisting request?",

              answer: `
                    <ol>
                        <li>Understand why the application or file needs to be whitelisted.</li>
                        <li>Verify that it is legitimate and business-approved.</li>
                        <li>Investigate file details, hash, publisher and behavior.</li>
                        <li>Check whether the detection is a false positive.</li>
                        <li>Follow the organization's approval process.</li>
                        <li>Apply the minimum required and specific exclusion.</li>
                        <li>Monitor the result after the change.</li>
                    </ol>
                `,
            },

            {
              question: "How do you reduce False Positives in MDE?",

              answer: `
                    <ul>
                        <li>Identify recurring false-positive alerts.</li>
                        <li>Investigate the activity and determine the root cause.</li>
                        <li>Validate the application, file or activity.</li>
                        <li>Fine-tune the policy based on investigation results.</li>
                        <li>Use specific and controlled exclusions when approved.</li>
                        <li>Avoid broad exclusions.</li>
                        <li>Monitor the environment after changes.</li>
                    </ul>
                `,
            },
          ],
        },

        /* PART 5 */

        {
          id: "part5",
          title: "Part 5 – MDE Deployment & Policy Management",
          description:
            "MDE deployment, onboarding and security policy management",

          questions: [
            {
              question:
                "How would you deploy Microsoft Defender for Endpoint on 25,000 devices?",

              answer: `
                    <ol>
                        <li>First, I will understand environment.</li>
                        <li>Check supported operating systems.</li>
                        <li>Verify network, proxy and firewall connectivity.</li>
                        <li>Identify existing antivirus/security solutions.</li>
                        <li>Select the appropriate onboarding method such as Intune or Configuration Manager.</li>
                        <li>Start with a small pilot group containing small number of device around 100.</li>
                        <li>and then Validate onboarding, sensor health, alerts and policy impact.</li>
                        <li>Deploy in phases instead of onboarding all 25,000 devices at once.</li>
                        <li>Continuously monitor onboarding failures, false positives and device health.</li>
                    </ol>

                    <div class="alert alert-success">
                        <strong>Easy:</strong>
                        Assessment → Preparation → Pilot → Validate → Phased Rollout → Monitor
                    </div>
                `,
            },

            {
              question: "What challenges can occur during Defender deployment?",

              answer: `
                    <ul>
                        <li>Network connectivity issues.</li>
                        <li>Proxy or firewall configuration problems.</li>
                        <li>Unsupported operating systems or missing prerequisites.</li>
                        <li>Third-party antivirus or any security software conflicts.</li>
                        <li>Onboarding policy or script failures.</li>
                        <li>Too many alerts and false positives.</li>
                        <li>Legitimate applications being blocked.</li>
                        <li>Business disruption due to aggressive security policies.</li>
